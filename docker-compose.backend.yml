services:
  postgres:
    image: postgres:18
    container_name: loanwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: loanwise
      POSTGRES_PASSWORD: loanwise
      POSTGRES_DB: loanwise
    ports:
      - "5434:5432"
    volumes:
      - loanwise_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanwise -d loanwise"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  loanwise_postgres_data:
